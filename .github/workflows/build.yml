name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # sign 为 no-op（无商业证书）；一次构建产出 NSIS 安装包 + 便携版。
      # 直接以 node 调用 electron-builder 的 CLI 入口，避免 .bin shim 差异。
      - name: Build NSIS installer and portable exe
        shell: bash
        run: |
          echo "=== toolchain ==="
          node -v
          node ./node_modules/electron-builder/cli.js --version
          node -e "console.log('electron:', require('electron/package.json').version)"
          ls -lh node_modules/electron/dist/electron.exe || true
          echo "=== building ==="
          node ./node_modules/electron-builder/cli.js --win --x64 --config electron-builder.js --publish never
          echo "=== dist ==="
          ls -lh dist/*.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrayMetrics-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          overwrite_files: true
