<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>系统信息 · TrayMetrics</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#1d1d26}
body{font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;color:#eef0f6;-webkit-font-smoothing:antialiased;user-select:none;display:flex;flex-direction:column}
.bar{height:54px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:#24242e;border-bottom:0.5px solid rgba(255,255,255,.14);-webkit-app-region:drag}
.bar .logo{width:8px;height:22px;border-radius:3px;background:#7f77dd;flex:none}
.bar .txt{min-width:0;flex:1}
.bar h1{margin:0;font-size:14px;font-weight:500;line-height:1.3}
.bar p{margin:2px 0 0;font-size:10.5px;color:rgba(238,240,246,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .acts{display:flex;gap:7px;flex:none;-webkit-app-region:no-drag}
.bar button{font-family:inherit;font-size:11px;color:#eef0f6;background:transparent;border:0.5px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:rgba(255,255,255,.1)}
.bar button:disabled{opacity:.45;cursor:default}
.bar .x{border:0;font-size:19px;line-height:1;padding:2px 6px;color:rgba(238,240,246,.6)}
.bar .x:hover{color:#eef0f6;background:transparent}
.wrap{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px 18px}
.wrap::-webkit-scrollbar{width:7px}
.wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.17);border-radius:4px}
.wrap::-webkit-scrollbar-track{background:transparent}
#status{font-size:11.5px;color:rgba(238,240,246,.6);padding:16px 4px 20px;line-height:1.7}
#status.err{color:#f0b27a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:11px;align-content:start}
.card{background:rgba(255,255,255,.035);border:0.5px solid rgba(255,255,255,.11);border-radius:11px;padding:13px 15px 9px;min-width:0}
.card h2{margin:0 0 9px;font-size:12px;font-weight:500;color:#b9b5f0;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.card h2 .tag{font-size:10px;font-weight:400;color:rgba(238,240,246,.4);letter-spacing:0}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0;border-top:0.5px solid rgba(255,255,255,.075);font-size:11.5px;line-height:1.5}
.row span:first-child{color:rgba(238,240,246,.55);flex:none;white-space:nowrap}
.row b{font-weight:500;font-family:Consolas,"Microsoft YaHei",monospace;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.row b.na{color:rgba(238,240,246,.3);font-weight:400}
.row b.hl{color:#9fe1cb}
.sub{font-size:10.5px;color:rgba(238,240,246,.42);padding:8px 0 4px;line-height:1.6}
.sub:not(:first-child){border-top:0.5px solid rgba(255,255,255,.075);margin-top:4px}
.foot{flex:none;padding:9px 17px;border-top:0.5px solid rgba(255,255,255,.09);font-size:10.5px;color:rgba(238,240,246,.38);line-height:1.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="bar">
  <div class="logo"></div>
  <div class="txt">
    <h1>系统信息</h1>
    <p id="subtitle">正在读取硬件信息…</p>
  </div>
  <div class="acts">
    <button id="btnCopy" title="复制纯文本摘要">复制摘要</button>
    <button id="btnRefresh" title="重新采集">刷新</button>
    <button class="x" id="btnClose" title="关闭 (Esc)">×</button>
  </div>
</div>
<div class="wrap">
  <div id="status">正在读取硬件信息…<br>首次读取需要启动一次系统信息查询，可能需要十几秒；结果会缓存，之后再打开即时显示。</div>
  <div class="grid" id="grid" hidden></div>
</div>
<div class="foot">数据来自 Windows WMI/CIM、powercfg 电池报告、nvidia-smi 与 Electron 显示接口，全部在本机读取、不联网；部分硬件接口参考 LenovoLegionToolkit 公开的接口事实。</div>
<script src="hwinfo-page.js"></script>
</body>
</html>
