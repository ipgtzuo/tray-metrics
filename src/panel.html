<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>TrayMetrics</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{
  font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;
  color:#eef0f6;-webkit-font-smoothing:antialiased;user-select:none;padding:9px;
}
.card{
  width:100%;height:auto;min-height:100%;display:flex;flex-direction:column;
  background:rgba(36,36,46,.985);border:0.5px solid rgba(255,255,255,.16);
  border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.55);
  padding:15px 17px 12px;overflow:hidden;
}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:1px}
.body::-webkit-scrollbar{width:5px}
.body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
.body::-webkit-scrollbar-track{background:transparent}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.title{font-size:13px;font-weight:500}
.badge{font-size:10.5px;color:rgba(238,240,246,.45);display:flex;align-items:center;gap:5px}
.badge i{width:6px;height:6px;border-radius:50%;background:#5dcaa5}
.x{border:0;background:transparent;color:rgba(238,240,246,.5);font-size:17px;line-height:1;cursor:pointer;padding:0 2px}
.x:hover{color:#eef0f6}

.iconrow{display:flex;align-items:center;gap:12px;padding:9px 10px;margin-bottom:12px;background:rgba(0,0,0,.22);border-radius:9px}
.iconrow img{width:44px;height:44px;image-rendering:pixelated;background:rgba(255,255,255,.05);border-radius:7px;flex:none}
.iconrow .il{font-size:10px;color:rgba(238,240,246,.4);letter-spacing:.5px;margin-bottom:4px}
.iconrow .it{font-size:13px;font-weight:500;margin-bottom:3px}
.iconrow .id{font-size:10.5px;color:rgba(238,240,246,.5);line-height:1.5}

.hero{font-size:31px;font-weight:500;letter-spacing:-.5px;line-height:1.08;font-variant-numeric:tabular-nums}
.hero .unit{font-size:13px;color:rgba(238,240,246,.5);font-weight:400;margin-left:5px;letter-spacing:0}
.sub{font-size:11px;color:rgba(238,240,246,.42);margin:5px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:block;width:100%;height:48px;margin-bottom:9px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;padding:6.5px 0;border-top:0.5px solid rgba(255,255,255,.09);font-size:12px}
.row span:first-child{color:rgba(238,240,246,.55)}
.row b{font-weight:500;font-family:Consolas,monospace;font-variant-numeric:tabular-nums}
.row b.na{color:rgba(238,240,246,.33);font-weight:400;font-size:11px}
.notice{font-size:10.5px;line-height:1.5;color:#f0b27a;background:rgba(240,120,74,.09);border:0.5px solid rgba(240,120,74,.25);border-radius:7px;padding:7px 9px;margin-top:9px}

.listview{flex:0 0 auto;overflow:hidden}
.listrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border:0;border-top:0.5px solid rgba(255,255,255,.09);background:transparent;color:#eef0f6;font-family:inherit;font-size:12px;cursor:pointer;text-align:left}
.listrow:hover{background:rgba(255,255,255,.06)}
.listrow .sw{width:4px;height:16px;border-radius:2px;flex:none}
.listrow .nm{flex:1}
.listrow .v{font-family:Consolas,monospace;font-variant-numeric:tabular-nums;color:rgba(238,240,246,.72);font-size:11.5px}
.listrow .v.na{color:rgba(238,240,246,.3)}
.listrow .cur{font-size:10px;color:var(--tc,#7fb3ff)}

.foot{flex:none;margin-top:auto;padding-top:10px;border-top:0.5px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10.5px;color:rgba(238,240,246,.42)}
.foot .src{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:6px;flex:none}
.btns button{font-size:11px;font-family:inherit;color:#eef0f6;background:transparent;border:0.5px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap;min-width:76px;text-align:center}
.btns button:hover{background:rgba(255,255,255,.09)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="title" id="title">网速 · 详情</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="badge"><i></i><span id="clock">采集中</span></span>
      <button class="x" id="btnX" title="关闭">×</button>
    </div>
  </div>

  <div class="iconrow">
    <img id="iconPreview" alt="托盘图标放大预览">
    <div>
      <div class="il">当前托盘图标 · 4× 放大</div>
      <div class="it" id="iconName">网速 NET</div>
      <div class="id" id="iconDesc">单字母类型 + 数值</div>
    </div>
  </div>

  <div class="body">
    <div id="detail">
      <div class="hero"><span id="heroVal">—</span><span class="unit" id="heroUnit"></span></div>
      <div class="sub" id="heroSub">正在采集…</div>
      <svg class="chart" viewBox="0 0 300 48" preserveAspectRatio="none">
        <path d="M0 10 H300 M0 27 H300 M0 44 H300" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="0.5"/>
        <path id="area" fill="#7fb3ff" fill-opacity=".14" d=""/>
        <path id="line" fill="none" stroke="#7fb3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d=""/>
      </svg>
      <div class="rows" id="rows"></div>
      <div class="notice" id="notice" hidden></div>
    </div>

    <div class="listview" id="listView" hidden></div>
  </div>

  <div class="foot">
    <span class="src" id="source">数据源 · —</span>
    <div class="btns">
      <button type="button" id="btnToggle">全部指标</button>
    </div>
  </div>
</div>
<script src="panel.js"></script>
</body>
</html>
